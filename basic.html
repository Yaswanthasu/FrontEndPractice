<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Bite</title>
    <link rel="styleSheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tasty Bite</h1>
    </header>
    <section class="Banner">
        <img src="Website-Food-Banner.jpg" alt="Tasty Bite Image">
    </section>
    <section class="about-section">
        <h2>About us</h2>
        <div class="about-content">
            <p>We are here to serve your food</p>
            <img src="indian street food.jpg">
        </div>
    </section>
    <section class="Menu">
        <h2>Menu</h2>
        <div class="items">
            <img src="pizza.jpeg">
            <span class="dish-name">Margrita pizza</span>
            <button>Order Now</button>
        </div>
        <div class="items">
            <img src="sandwich.png">
            <span class="dish-name">Chicken Sandwich</span>
            <button>Order Now</button>
        </div>
        <div class="items">
            <img src="Burger.jpg">
            <span class="dish-name">Chicken Burger</span>
            <button>Order Now</button>
        </div>
    </section>  
    <footer>
        <p>
            <a href="#">Contact</a> || <a href="#">Faq</a>
        </p>
        <p>@2026, Tasty Bite</p>
    </footer>
</body>
</html>
